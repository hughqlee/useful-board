[project]
name = "useful-board"
version = "0.1.0"
description = "목표를 세우고, 지표를 정하고, 필요한 일이 진행되게 돕는 보드. 에이전트 툴 안에서만 돈다."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.scripts]
useful-board = "useful_board.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/useful_board"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
